name: FOIA requests offline product acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Run offline application tests
        run: |
          python scripts/check_foundation.py
          python scripts/validate_plan.py
      - name: Build package with its pinned backend
        run: |
          python -m pip install --disable-pip-version-check setuptools==84.0.0
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Validate fail-closed CLI in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-deps --no-index --find-links "$RUNNER_TEMP/wheels" send-foia-log-requests==0.1.0
          "$RUNNER_TEMP/consumer/bin/foia-requests" --help
          "$RUNNER_TEMP/consumer/bin/foia-requests" --config fixtures/offline-config.json draft \
            --ledger "$RUNNER_TEMP/state/ledger.sqlite" --directory-source fixtures/directory \
            --coverage fixtures/aggregator_export --profile fixtures/profiles/synthetic-requester.json \
            --select fed:doj/oip:calendar:2024 --select fed:doj/oip:calendar:2023 \
            --out "$RUNNER_TEMP/packets" --as-of 2026-11-15T00:00:00Z > "$RUNNER_TEMP/dry-run.json"
          python -c "import json,os; r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'dry-run.json'))); assert r['outbound_messages_sent']==0; assert r['decisions']==['draft','suppressed_public_coverage']; assert r['ext_corpus_satisfied'] is False"
          "$RUNNER_TEMP/consumer/bin/foia-requests" --config fixtures/offline-config.json prepare \
            --ledger "$RUNNER_TEMP/state/ledger.sqlite" --coverage fixtures/aggregator_export \
            --profile fixtures/profiles/synthetic-requester.json --last-days 7 --today 2026-11-16 \
            --out "$RUNNER_TEMP/prepare" --as-of 2026-11-16T00:00:00Z > "$RUNNER_TEMP/prepare.json"
          python -c "import json,os; r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'prepare.json'))); assert r['outbound_messages_sent']==0 and r['live_dispatch_authorized'] is False and r['drafts']==4"
          grep -q "Nothing was sent" "$RUNNER_TEMP/prepare/review-packet.md"
          "$RUNNER_TEMP/consumer/bin/foia-requests" approve template > "$RUNNER_TEMP/approve.json"
          python -c "import json,os; r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'approve.json'))); assert r['status']=='dry_run_nothing_written'"
          "$RUNNER_TEMP/consumer/bin/foia-requests" send --help > /dev/null
          if "$RUNNER_TEMP/consumer/bin/foia-requests" --config fixtures/offline-config.json dispatch; then
            echo "Unsafe: dispatch did not fail closed" >&2
            exit 1
          fi
